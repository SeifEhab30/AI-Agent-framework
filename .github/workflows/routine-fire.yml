name: Routine Fire Relay

# Thin relay only -- this workflow does no maintenance or Builder work
# itself. workflow_dispatch-only, triggered by the Dispatcher Routine via
# the GitHub MCP connector's actions_run_trigger(method: run_workflow).
# Its one job: forward an authenticated POST to Anthropic's routine-fire
# endpoint for the requested target, using that target's own encrypted
# Actions secret. The real work (spec-vs-code review, feature builds)
# happens in the Claude Code Routine session that gets spawned as a
# result of that call, not here.

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which routine to fire"
        required: true
        type: choice
        options:
          - maintenance
          - builder
          - merge_gate

permissions: {}

jobs:
  fire:
    runs-on: ubuntu-latest
    steps:
      - name: Fire the requested routine
        env:
          TARGET: ${{ inputs.target }}
          MAINTENANCE_FIRE_TOKEN: ${{ secrets.MAINTENANCE_FIRE_TOKEN }}
          BUILDER_FIRE_TOKEN: ${{ secrets.BUILDER_FIRE_TOKEN }}
          MERGE_GATE_FIRE_TOKEN: ${{ secrets.MERGE_GATE_FIRE_TOKEN }}
        run: |
          set -euo pipefail

          echo "::notice::firing target=$TARGET"

          # These three trigger IDs are fork-specific -- replace each with your
          # own RemoteTrigger's ID (shown when you create it in the claude.ai
          # Routines UI) before this workflow can fire anything. The original
          # repo's IDs were removed here deliberately as part of a handoff --
          # left in place, they'd just produce a 404/auth failure against
          # triggers this fork's tokens (see the three *_FIRE_TOKEN secrets)
          # don't have permission to fire anyway.
          case "$TARGET" in
            maintenance)
              TRIGGER_ID="<MAINTENANCE_TRIGGER_ID>"
              TOKEN="$MAINTENANCE_FIRE_TOKEN"
              ;;
            builder)
              TRIGGER_ID="<BUILDER_TRIGGER_ID>"
              TOKEN="$BUILDER_FIRE_TOKEN"
              ;;
            merge_gate)
              TRIGGER_ID="<MERGE_GATE_TRIGGER_ID>"
              TOKEN="$MERGE_GATE_FIRE_TOKEN"
              ;;
            *)
              echo "::error::Unknown target '$TARGET' -- must be maintenance, builder, or merge_gate"
              exit 1
              ;;
          esac

          case "$TRIGGER_ID" in
            \<*_TRIGGER_ID\>)
              echo "::error::TRIGGER_ID for '$TARGET' is still the placeholder '$TRIGGER_ID' -- edit this workflow's case block and replace it with your own RemoteTrigger's ID"
              exit 1
              ;;
          esac

          if [ -z "$TOKEN" ]; then
            echo "::error::No fire token configured for target '$TARGET' -- add it as an Actions secret"
            exit 1
          fi

          HTTP_CODE=$(curl -sS -o response.json -w "%{http_code}" -X POST \
            "https://api.anthropic.com/v1/claude_code/routines/${TRIGGER_ID}/fire" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "anthropic-version: 2023-06-01" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "Content-Type: application/json" \
            -d '{}')

          echo "HTTP status: $HTTP_CODE"
          cat response.json
          echo

          if [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::Fire request for '$TARGET' failed with HTTP $HTTP_CODE"
            exit 1
          fi

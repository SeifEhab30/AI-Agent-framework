name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # doc_gardener dates sources by last commit; a shallow clone has
          # no per-file history, so it would skip its staleness checks.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: ruff
        run: ruff check .
      - name: ruff format check
        run: ruff format --check .
      - name: import-linter
        run: lint-imports
      - name: pytest
        run: pytest -q
      - name: golden rules
        run: python scripts/check_golden_rules.py
      - name: builder scope (agentic-build branches only)
        # Only the Builder Routine's branches are subject to its scope guard;
        # normal human/maintenance PRs touch files the builder may not, so this
        # gate is scoped to agentic-build/* by branch name. Needs fetch-depth: 0
        # (set above) to diff against origin/master.
        if: startsWith(github.head_ref, 'agentic-build/') || startsWith(github.ref_name, 'agentic-build/')
        run: python scripts/check_builder_scope.py --base origin/master
      - name: doc gardener (report only, non-blocking)
        continue-on-error: true
        run: python scripts/doc_gardener.py

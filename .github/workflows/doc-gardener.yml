name: Doc Gardener

on:
  schedule:
    - cron: "0 21 * * 0" # weekly, Sunday 21:00 UTC = Monday 00:00 GMT+3
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  garden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Run doc gardener with auto-fix
        run: python scripts/doc_gardener.py --fix
      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create branch and commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          BRANCH="doc-gardener/report-$(date +%Y%m%d-%H%M%S)"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git config user.name "doc-gardener-bot"
          git config user.email "actions@github.com"
          git checkout -b "$BRANCH"
          git add docs/
          git commit -m "doc-gardener: automated report + link fixes"
          git push origin "$BRANCH"
      - name: Open PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls" \
            -d "{\"title\":\"doc-gardener: automated report + fixes\",\"head\":\"$BRANCH\",\"base\":\"master\",\"body\":\"Automated doc-gardener run. Review any auto-fixed broken links and remaining flagged staleness in docs/quality-score/report.md before merging.\"}")
          echo "HTTP status: $HTTP_CODE"
          cat response.json
          if [ "$HTTP_CODE" -ge 300 ]; then
            echo "::error::PR creation failed with HTTP $HTTP_CODE. Check Settings > Actions > General > Workflow permissions > 'Allow GitHub Actions to create and approve pull requests' is enabled."
            exit 1
          fi

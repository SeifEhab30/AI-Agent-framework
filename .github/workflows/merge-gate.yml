name: Merge Gate (advisory only)

# PAUSED as the merge mechanism (2026-08-25): the actual merge decision and
# action now live in the Merge Gate Routine (docs/references/merge-gate-
# prompt.md), a RemoteTrigger-fired Claude Code session -- same model as
# Maintenance/Builder/Dispatcher, chosen so the semantic traceability
# judgment doesn't need a separate billed API key or a since-retired free
# option (GitHub Models returned 410 github_models_retirement_brownout on
# a live test). This workflow no longer merges anything; it only runs the
# mechanical checks (scripts/check_merge_gate.py --mechanical-only) and
# comments the result, as an early signal before the Routine even looks at
# the PR. The github-models/claude adapter path in scripts/run-agent.sh and
# the read/write job-permission split are kept as-is for reference -- worth
# revisiting once a durable no-separate-billing model option exists.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  review:
    # Any open PR is a candidate now (widened 2026-08-26, matching
    # check_merge_gate.py's own eligibility -- branch/author no longer
    # gate this, only diff shape and the traceability convention do).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      verdict: ${{ steps.gate.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run merge gate checks
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # --mechanical-only: no LLM call wired in yet. GitHub Models (the
          # planned no-separate-billing option) turned out to be mid-
          # retirement when tested (410 github_models_retirement_brownout);
          # the claude case needs a real ANTHROPIC_API_KEY that isn't set up.
          # See merge-gate-prompt.md's Known gaps. Semantic traceability is
          # not enforced until one of those is resolved -- only the
          # mechanical checks (CI green, frontend_only shape, traceability
          # row/function structure) gate eligibility right now.
          if python scripts/check_merge_gate.py --pr "${{ github.event.pull_request.number }}" --mechanical-only | tee gate_output.txt; then
            echo "verdict=eligible" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=blocked" >> "$GITHUB_OUTPUT"
          fi
      - name: Comment findings if blocked
        if: steps.gate.outputs.verdict == 'blocked'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo "**Merge gate: not eligible for auto-merge.**"
            echo
            echo '```'
            cat gate_output.txt
            echo '```'
          } | gh pr comment "${{ github.event.pull_request.number }}" --body-file -

  # No merge job. Merge authority lives in the Merge Gate Routine session
  # now -- see the file-header note above. This workflow never has
  # contents:write.
